<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Troll Dash - Pro Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <div id="level-display">LEVEL: 1 / 4</div>
        <div id="death-display">DEATHS: 0</div>
    </div>

    <div id="message-box">Reach the door!</div>

    <canvas id="gameCanvas" width="560" height="240"></canvas>

    <div class="controls">
        <div class="move-btns">
            <button id="btn-left">◀</button>
            <button id="btn-right">▶</button>
        </div>
        <button id="btn-jump">JUMP</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
